name: Make consent sheet pictures
on:
  workflow_dispatch:
  push:
    paths:
      - 'sheets/**'
      - 'render.py'
      - 'requirements.txt'
      - '.github/workflows/render.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install -r requirements.txt
      - name: Validate and render sheets
        run: python render.py
      - name: Downloadable pictures
        uses: actions/upload-artifact@v4
        with:
          name: completed-consent-sheets
          path: output/**/*.png
          if-no-files-found: error
          retention-days: 30
